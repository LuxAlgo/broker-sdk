<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How every adapter stays correct: fetchRaw does IO only, normalize is pure, golden vectors gate every adapter">
  <defs>
    <style>
      @font-face { font-family: 'Aeonik'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3f3f3f"/>
    </marker>
  </defs>

  <rect width="1200" height="240" rx="12" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="11.5" stroke="#1f1f1f"/>

  <text x="60" y="52" font-family="Aeonik, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="17" fill="#ededed">How every adapter stays correct</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="60" y="84" width="212" height="68" rx="8" fill="#141414" stroke="#262626"/>
    <text x="166" y="113" font-size="14" fill="#ededed">read-only keys</text>
    <text x="166" y="136" font-size="11.5" fill="#7d7d7d">never leave your machine</text>

    <rect x="336" y="84" width="212" height="68" rx="8" fill="#141414" stroke="#262626"/>
    <text x="442" y="113" font-size="14" fill="#ededed">fetchRaw()</text>
    <text x="442" y="136" font-size="11.5" fill="#7d7d7d">IO only, per broker</text>

    <rect x="612" y="84" width="212" height="68" rx="8" fill="#141414" stroke="#262626"/>
    <text x="718" y="113" font-size="14" fill="#ededed">normalize()</text>
    <text x="718" y="136" font-size="11.5" fill="#7d7d7d">pure, no network</text>

    <rect x="888" y="84" width="252" height="68" rx="8" fill="#141414" stroke="#262626"/>
    <text x="1014" y="113" font-size="14" fill="#ededed">one schema</text>
    <text x="1014" y="136" font-size="11.5" fill="#7d7d7d">accounts &#183; positions &#183; trades</text>
  </g>

  <line x1="274" y1="118" x2="332" y2="118" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="118" x2="608" y2="118" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="826" y1="118" x2="884" y2="118" stroke="#3f3f3f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="718" y1="152" x2="718" y2="176" stroke="#262626" stroke-dasharray="3 4"/>
  <rect x="336" y="176" width="764" height="32" rx="8" fill="#0a0a0a" stroke="#262626"/>
  <text x="718" y="197" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#7d7d7d">conformance/vectors &#183; golden raw and normalized pairs gate every adapter &#183; tested with zero credentials</text>
</svg>
