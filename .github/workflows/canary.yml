name: Canary

# Daily live check of every adapter against LuxAlgo-held paper/sandbox
# accounts. Dormant until the BROKERS_* secrets are configured — with no
# credentials the run is a green no-op.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run canary
        id: canary
        env:
          BROKERS_ALPACA_API_KEY: ${{ secrets.BROKERS_ALPACA_API_KEY }}
          BROKERS_ALPACA_API_SECRET: ${{ secrets.BROKERS_ALPACA_API_SECRET }}
          BROKERS_BINANCE_API_KEY: ${{ secrets.BROKERS_BINANCE_API_KEY }}
          BROKERS_BINANCE_API_SECRET: ${{ secrets.BROKERS_BINANCE_API_SECRET }}
          BROKERS_BYBIT_API_KEY: ${{ secrets.BROKERS_BYBIT_API_KEY }}
          BROKERS_BYBIT_API_SECRET: ${{ secrets.BROKERS_BYBIT_API_SECRET }}
          BROKERS_CRYPTO_COM_API_KEY: ${{ secrets.BROKERS_CRYPTO_COM_API_KEY }}
          BROKERS_CRYPTO_COM_API_SECRET: ${{ secrets.BROKERS_CRYPTO_COM_API_SECRET }}
          BROKERS_HYPERLIQUID_WALLET_ADDRESS: ${{ secrets.BROKERS_HYPERLIQUID_WALLET_ADDRESS }}
          BROKERS_IBKR_FLEX_FLEX_TOKEN: ${{ secrets.BROKERS_IBKR_FLEX_FLEX_TOKEN }}
          BROKERS_IBKR_FLEX_FLEX_QUERY_ID: ${{ secrets.BROKERS_IBKR_FLEX_FLEX_QUERY_ID }}
          BROKERS_KRAKEN_API_KEY: ${{ secrets.BROKERS_KRAKEN_API_KEY }}
          BROKERS_KRAKEN_API_SECRET: ${{ secrets.BROKERS_KRAKEN_API_SECRET }}
          BROKERS_OKX_API_KEY: ${{ secrets.BROKERS_OKX_API_KEY }}
          BROKERS_OKX_API_SECRET: ${{ secrets.BROKERS_OKX_API_SECRET }}
          BROKERS_OKX_PASSPHRASE: ${{ secrets.BROKERS_OKX_PASSPHRASE }}
          BROKERS_PUBLIC_API_KEY: ${{ secrets.BROKERS_PUBLIC_API_KEY }}
          BROKERS_QUESTRADE_REFRESH_TOKEN: ${{ secrets.BROKERS_QUESTRADE_REFRESH_TOKEN }}
          BROKERS_TOPSTEP_USER_NAME: ${{ secrets.BROKERS_TOPSTEP_USER_NAME }}
          BROKERS_TOPSTEP_API_KEY: ${{ secrets.BROKERS_TOPSTEP_API_KEY }}
          BROKERS_TRADIER_ACCESS_TOKEN: ${{ secrets.BROKERS_TRADIER_ACCESS_TOKEN }}
          BROKERS_TRADING212_API_KEY: ${{ secrets.BROKERS_TRADING212_API_KEY }}
          BROKERS_WEBULL_API_KEY: ${{ secrets.BROKERS_WEBULL_API_KEY }}
          BROKERS_WEBULL_API_SECRET: ${{ secrets.BROKERS_WEBULL_API_SECRET }}
        run: set -o pipefail && node scripts/canary.mjs | tee canary-output.md
      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = [
              "The daily canary found at least one broker adapter failing against its live/sandbox environment.",
              "",
              fs.existsSync("canary-output.md") ? fs.readFileSync("canary-output.md", "utf8") : "(no output captured)",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "canary",
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: "Canary: broker adapter failing", body, labels: ["canary"],
              });
            }
